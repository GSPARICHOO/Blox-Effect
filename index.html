<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Clon de Minecraft - Alpha 1.0.11</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      width: 10px; height: 10px;
      background: white;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: difference;
    }
    #instructions {
      position: absolute;
      top: 20px; left: 20px;
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border-radius: 8px;
    }
    #hotbar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px;
      border-radius: 8px;
    }
    .slot {
      width: 48px;
      height: 48px;
      border: 3px solid #555;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 11px;
      text-align: center;
      box-sizing: border-box;
      position: relative;
    }
    .slot.selected {
      border-color: #fff;
      box-shadow: 0 0 8px #fff;
    }
    .slot span {
      position: absolute;
      top: 2px;
      left: 4px;
      font-size: 10px;
      text-shadow: 1px 1px 2px black;
    }
    #slot-1 { background-color: #7cbd6b; }
    #slot-2 { background-color: #8b5a2b; }
    #slot-3 { background-color: #777777; }
    #slot-4 { background-color: #a0522d; }
    #slot-5 { background-color: #b22222; }
    #slot-6 { background-color: rgba(173, 216, 230, 0.7); }
    #slot-7 { background-color: #ffaa00; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

  <div id="crosshair"></div>
  <div id="instructions">
    <b>Haz clic en la pantalla para jugar</b><br>
    W, A, S, D: Moverse | Espacio: Saltar<br>
    <b>Teclas 1 - 7: Seleccionar Bloque</b><br>
    Clic Izquierdo: Romper | Clic Derecho: Poner
  </div>

  <div id="hotbar">
    <div id="slot-1" class="slot selected"><span>1</span>Pasto</div>
    <div id="slot-2" class="slot"><span>2</span>Tierra</div>
    <div id="slot-3" class="slot"><span>3</span>Piedra</div>
    <div id="slot-4" class="slot"><span>4</span>Madera</div>
    <div id="slot-5" class="slot"><span>5</span>Ladrillo</div>
    <div id="slot-6" class="slot"><span>6</span>Vidrio</div>
    <div id="slot-7" class="slot"><span>7</span>Luz</div>
  </div>

  <script>
    // 1. Texturas Pixel Art (Verde Neón estilo Alpha 1.0.11)
    function createPixelTexture(baseColorHex, noiseFactor = 30) {
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 16;
      const ctx = canvas.getContext('2d');

      const r = (baseColorHex >> 16) & 255;
      const g = (baseColorHex >> 8) & 255;
      const b = baseColorHex & 255;

      for (let x = 0; x < 16; x++) {
        for (let y = 0; y < 16; y++) {
          const noise = (Math.random() - 0.5) * noiseFactor;
          const nr = Math.min(255, Math.max(0, r + noise));
          const ng = Math.min(255, Math.max(0, g + noise));
          const nb = Math.min(255, Math.max(0, b + noise));
          ctx.fillStyle = `rgb(${nr},${ng},${nb})`;
          ctx.fillRect(x, y, 1, 1);
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      return texture;
    }

    // 2. Configuración de Escena
    const scene = new THREE.Scene();
    const dayColor = new THREE.Color(0x87ceeb);
    const nightColor = new THREE.Color(0x050510);
    scene.background = dayColor.clone();

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
    scene.add(sunLight);

    const sunGeo = new THREE.BoxGeometry(4, 4, 4);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd44 });
    const sunMesh = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sunMesh);

    const controls = new THREE.PointerLockControls(camera, document.body);
    document.addEventListener('click', () => controls.lock());

    camera.position.set(0, 5, 0);

    // 3. Materiales
    const grassMat = new THREE.MeshLambertMaterial({ map: createPixelTexture(0x7cbd6b, 30) });
    const dirtMat = new THREE.MeshLambertMaterial({ map: createPixelTexture(0x8b5a2b, 40) });
    const stoneMat = new THREE.MeshLambertMaterial({ map: createPixelTexture(0x777777, 50) });
    const woodMat = new THREE.MeshLambertMaterial({ map: createPixelTexture(0xa0522d, 35) });
    const leavesMat = new THREE.MeshLambertMaterial({ map: createPixelTexture(0x4aed43, 40) });
    const brickMat = new THREE.MeshLambertMaterial({ map: createPixelTexture(0xb22222, 45) });
    const glassMat = new THREE.MeshLambertMaterial({ 
      map: createPixelTexture(0xadd8e6, 20), 
      transparent: true, 
      opacity: 0.6 
    });
    const lightBlockMat = new THREE.MeshBasicMaterial({ color: 0xffdd66 });

    const BLOCK_TYPES = {
      1: grassMat, 2: dirtMat, 3: stoneMat, 4: woodMat, 5: brickMat, 6: glassMat, 7: lightBlockMat
    };
    let selectedBlockType = 1;

    const blockGeo = new THREE.BoxGeometry(1, 1, 1);
    const blocks = [];

    // 4. Terreno
    const CHUNK_SIZE = 14;
    const DEPTH = 10;

    for (let x = -CHUNK_SIZE / 2; x < CHUNK_SIZE / 2; x++) {
      for (let z = -CHUNK_SIZE / 2; z < CHUNK_SIZE / 2; z++) {
        for (let y = 0; y > -DEPTH; y--) {
          let material = stoneMat;
          if (y === 0) material = grassMat;
          else if (y === -1 || y === -2) material = dirtMat;

          const cube = new THREE.Mesh(blockGeo, material);
          cube.position.set(x, y, z);
          scene.add(cube);
          blocks.push(cube);
        }
      }
    }

    // 5. Árbol Único
    function createTree(treeX, treeZ) {
      for (let y = 1; y <= 4; y++) {
        const trunk = new THREE.Mesh(blockGeo, woodMat);
        trunk.position.set(treeX, y, treeZ);
        scene.add(trunk);
        blocks.push(trunk);
      }
      for (let lx = -1; lx <= 1; lx++) {
        for (let lz = -1; lz <= 1; lz++) {
          for (let ly = 4; ly <= 5; ly++) {
            if (lx === 0 && lz === 0 && ly === 4) continue;
            const leaf = new THREE.Mesh(blockGeo, leavesMat);
            leaf.position.set(treeX + lx, ly, treeZ + lz);
            scene.add(leaf);
            blocks.push(leaf);
          }
        }
      }
    }
    createTree(3, 3);

    // 6. Controles Teclado
    const keys = {};
    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code.startsWith('Digit')) {
        const num = parseInt(e.code.replace('Digit', ''));
        if (num >= 1 && num <= 7) selectSlot(num);
      }
    });
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    function selectSlot(slotNumber) {
      selectedBlockType = slotNumber;
      document.querySelectorAll('.slot').forEach(slot => slot.classList.remove('selected'));
      document.getElementById(`slot-${slotNumber}`).classList.add('selected');
    }

    // 7. Físicas Corregidas (Bug de Autosalto Infinito Eliminado)
    let velocityY = 0;
    const gravity = -0.015;
    const jumpStrength = 0.25;
    let canJump = false;
    const playerHeight = 1.6;

    function updatePhysicsAndPlayer() {
      if (!controls.isLocked) return;

      const speed = 0.1;
      if (keys['KeyW']) controls.moveForward(speed);
      if (keys['KeyS']) controls.moveForward(-speed);
      if (keys['KeyA']) controls.moveRight(-speed);
      if (keys['KeyD']) controls.moveRight(speed);

      // Gravedad constante
      velocityY += gravity;

      // Salto Manual
      if (keys['Space'] && canJump) {
        velocityY = jumpStrength;
        canJump = false;
      }

      camera.position.y += velocityY;

      // Raycast hacia abajo con límite preciso
      const downRaycaster = new THREE.Raycaster(
        camera.position,
        new THREE.Vector3(0, -1, 0),
        0,
        playerHeight + 0.5 // Rango máximo acotado
      );

      const intersections = downRaycaster.intersectObjects(blocks);

      if (intersections.length > 0) {
        const hit = intersections[0];
        const targetY = hit.point.y + playerHeight;

        // Solo apoyamos los pies si la diferencia es menor a medio bloque (paso regular)
        if (camera.position.y - targetY <= 0.5) {
          camera.position.y = targetY;
          velocityY = 0;
          canJump = true;
        }
      }

      // Respawn si se cae al vacío
      if (camera.position.y < -30) {
        camera.position.set(0, 5, 0);
        velocityY = 0;
      }
    }

    // 8. Ciclo Día / Noche
    let time = 0;
    const daySpeed = 0.003;

    function updateDayNightCycle() {
      time += daySpeed;
      const radius = 80;
      const sunX = Math.cos(time) * radius;
      const sunY = Math.sin(time) * radius;

      sunLight.position.set(sunX, sunY, 0);
      sunMesh.position.set(sunX, sunY, 0);

      const sunHeight = Math.sin(time);
      const dayFactor = Math.max(0, Math.min(1, (sunHeight + 0.2) / 0.7));

      scene.background.lerpColors(nightColor, dayColor, dayFactor);
      sunLight.intensity = dayFactor * 0.8;
      ambientLight.intensity = 0.1 + (dayFactor * 0.4);
    }

    // 9. Romper y Colocar
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(0, 0);

    document.addEventListener('mousedown', (e) => {
      if (!controls.isLocked) return;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(blocks);

      if (intersects.length > 0) {
        const hit = intersects[0];

        if (e.button === 0) { 
          const target = hit.object;
          if (target.userData.light) {
            scene.remove(target.userData.light);
          }
          scene.remove(target);
          blocks.splice(blocks.indexOf(target), 1);
        } else if (e.button === 2) { 
          const targetBlock = hit.object;
          const normal = hit.face.normal;

          const newX = targetBlock.position.x + normal.x;
          const newY = targetBlock.position.y + normal.y;
          const newZ = targetBlock.position.z + normal.z;

          const currentMat = BLOCK_TYPES[selectedBlockType];
          const newBlock = new THREE.Mesh(blockGeo, currentMat);
          newBlock.position.set(newX, newY, newZ);

          if (selectedBlockType === 7) {
            const pointLight = new THREE.PointLight(0xffaa22, 1.5, 8);
            pointLight.position.set(newX, newY, newZ);
            scene.add(pointLight);
            newBlock.userData.light = pointLight;
          }

          scene.add(newBlock);
          blocks.push(newBlock);
        }
      }
    });

    document.addEventListener('contextmenu', e => e.preventDefault());

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      updatePhysicsAndPlayer();
      updateDayNightCycle();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
