<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Clon de Minecraft</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      width: 10px; height: 10px;
      background: white;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: difference;
    }
    #instructions {
      position: absolute;
      top: 20px; left: 20px;
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border-radius: 8px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

  <div id="crosshair"></div>
  <div id="instructions">
    <b>Haz clic en la pantalla para jugar</b><br>
    W, A, S, D: Moverse<br>
    Espacio: Saltar<br>
    Clic Izquierdo: Romper bloque<br>
    Clic Derecho: Poner bloque
  </div>

  <script>
    // 1. Configuración básica
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Luces
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // Controles
    const controls = new THREE.PointerLockControls(camera, document.body);
    document.addEventListener('click', () => controls.lock());

    camera.position.set(0, 5, 0);

    // 2. Geometría y Materiales
    const blockGeo = new THREE.BoxGeometry(1, 1, 1);
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x55aa55 });
    const stoneMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
    
    const blocks = [];

    // Generar terreno
    const CHUNK_SIZE = 12;
    const DEPTH = 10;

    for (let x = -CHUNK_SIZE / 2; x < CHUNK_SIZE / 2; x++) {
      for (let z = -CHUNK_SIZE / 2; z < CHUNK_SIZE / 2; z++) {
        for (let y = 0; y > -DEPTH; y--) {
          const material = (y === 0) ? grassMat : stoneMat;
          const cube = new THREE.Mesh(blockGeo, material);
          cube.position.set(x, y, z);
          scene.add(cube);
          blocks.push(cube);
        }
      }
    }

    // 3. Físicas y Movimiento
    const keys = {};
    document.addEventListener('keydown', (e) => keys[e.code] = true);
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    let velocityY = 0;
    const gravity = -0.015;
    const jumpStrength = 0.25;
    let canJump = false;
    const playerHeight = 1.6;

    function updatePhysicsAndPlayer() {
      if (!controls.isLocked) return;

      const speed = 0.1;
      if (keys['KeyW']) controls.moveForward(speed);
      if (keys['KeyS']) controls.moveForward(-speed);
      if (keys['KeyA']) controls.moveRight(-speed);
      if (keys['KeyD']) controls.moveRight(speed);

      velocityY += gravity;

      if (keys['Space'] && canJump) {
        velocityY = jumpStrength;
        canJump = false;
      }

      camera.position.y += velocityY;

      const downRaycaster = new THREE.Raycaster(
        camera.position,
        new THREE.Vector3(0, -1, 0),
        0,
        playerHeight
      );

      const intersections = downRaycaster.intersectObjects(blocks);

      if (intersections.length > 0) {
        const hit = intersections[0];
        camera.position.y = hit.point.y + playerHeight;
        velocityY = 0;
        canJump = true;
      }

      if (camera.position.y < -30) {
        camera.position.set(0, 5, 0);
        velocityY = 0;
      }
    }

    // 4. Romper y Colocar Bloques CORREGIDO
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(0, 0);

    document.addEventListener('mousedown', (e) => {
      if (!controls.isLocked) return;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(blocks);

      if (intersects.length > 0) {
        const hit = intersects[0];

        if (e.button === 0) { 
          // Clic Izquierdo: Romper bloque
          scene.remove(hit.object);
          blocks.splice(blocks.indexOf(hit.object), 1);
        } else if (e.button === 2) { 
          // Clic Derecho: Poner bloque con alineación exacta
          const targetBlock = hit.object;
          const normal = hit.face.normal;

          // Calculamos la nueva posición sumando la normal de la cara seleccionada
          const newX = targetBlock.position.x + normal.x;
          const newY = targetBlock.position.y + normal.y;
          const newZ = targetBlock.position.z + normal.z;

          const newBlock = new THREE.Mesh(blockGeo, grassMat);
          newBlock.position.set(newX, newY, newZ);
          scene.add(newBlock);
          blocks.push(newBlock);
        }
      }
    });

    document.addEventListener('contextmenu', e => e.preventDefault());

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      updatePhysicsAndPlayer();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
