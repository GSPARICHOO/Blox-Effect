<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Clon de Minecraft - Con Texturas</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 10px; height: 10px; background: white;
      transform: translate(-50%, -50%); border-radius: 50%;
      pointer-events: none; mix-blend-mode: difference; z-index: 10;
    }
    #instructions {
      position: absolute; top: 20px; left: 20px;
      color: white; background: rgba(0,0,0,0.8);
      padding: 10px 15px; border-radius: 8px; z-index: 10;
    }
    #ui-container {
      position: absolute; bottom: 75px; left: 50%;
      transform: translateX(-50%); display: flex;
      flex-direction: column; align-items: center; gap: 5px; z-index: 10;
    }
    #health-bar { display: flex; gap: 4px; font-size: 20px; }
    #hotbar {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%); display: flex; gap: 6px;
      background: rgba(0, 0, 0, 0.8); padding: 8px; border-radius: 8px; z-index: 10;
    }
    .slot {
      width: 50px; height: 50px; border: 3px solid #555;
      border-radius: 6px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: white;
      font-weight: bold; font-size: 10px; text-align: center;
      box-sizing: border-box; position: relative; background: rgba(255,255,255,0.1);
    }
    .slot.selected { border-color: #fff; box-shadow: 0 0 8px #fff; }
    .slot span.key { position: absolute; top: 2px; left: 4px; font-size: 9px; }
    .slot span.count { position: absolute; bottom: 2px; right: 4px; font-size: 11px; color: #ffde59; }
    #game-over {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(150, 0, 0, 0.8); color: white; flex-direction: column;
      justify-content: center; align-items: center; font-size: 30px; z-index: 20;
    }
    #game-over button {
      margin-top: 20px; padding: 10px 20px; font-size: 18px; cursor: pointer;
      border: none; background: white; border-radius: 5px;
    }
    #error-log {
      position: absolute; top: 10px; right: 10px; color: #ff5555;
      background: rgba(0,0,0,0.9); padding: 10px; display: none; z-index: 100;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="crosshair"></div>
  <div id="instructions">
    <b>Haz clic en la pantalla para jugar</b><br>
    W, A, S, D: Moverse | Espacio: Saltar<br>
    1 - 5 / Rueda del mouse: Cambiar bloque<br>
    Clic Izquierdo: Romper | Clic Derecho: Poner
  </div>

  <div id="ui-container">
    <div id="health-bar">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
  </div>

  <div id="hotbar">
    <div id="slot-1" class="slot selected"><span class="key">1</span>Pasto<span class="count" id="count-1">0</span></div>
    <div id="slot-2" class="slot"><span class="key">2</span>Tierra<span class="count" id="count-2">0</span></div>
    <div id="slot-3" class="slot"><span class="key">3</span>Piedra<span class="count" id="count-3">0</span></div>
    <div id="slot-4" class="slot"><span class="key">4</span>Madera<span class="count" id="count-4">0</span></div>
    <div id="slot-5" class="slot"><span class="key">5</span>Hojas<span class="count" id="count-5">0</span></div>
  </div>

  <div id="game-over">
    <h1>¡HAS MUERTO!</h1>
    <button onclick="respawnPlayer()">Reaparecer</button>
  </div>

  <div id="error-log"></div>

  <script>
    window.onerror = function(msg, url, line) {
      const log = document.getElementById('error-log');
      log.style.display = 'block';
      log.innerHTML = `<b>Error:</b> ${msg} (Línea: ${line})`;
    };

    // 1. Escena y Configuración
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Luces
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // 2. Carga de Texturas Propias
    const textureLoader = new THREE.TextureLoader();

    function loadCustomTexture(path) {
      const texture = textureLoader.load(path);
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      return texture;
    }

    const grassMat  = new THREE.MeshLambertMaterial({ map: loadCustomTexture('textures/pasto.png') });
    const dirtMat   = new THREE.MeshLambertMaterial({ map: loadCustomTexture('textures/tierra.png') });
    const stoneMat  = new THREE.MeshLambertMaterial({ map: loadCustomTexture('textures/piedra.png') });
    const woodMat   = new THREE.MeshLambertMaterial({ map: loadCustomTexture('textures/madera.png') });
    const leavesMat = new THREE.MeshLambertMaterial({ map: loadCustomTexture('textures/hojas.png'), transparent: true, alphaTest: 0.5 });

    const BLOCK_TYPES = {
      1: { name: "Pasto",  mat: grassMat },
      2: { name: "Tierra", mat: dirtMat },
      3: { name: "Piedra", mat: stoneMat },
      4: { name: "Madera", mat: woodMat },
      5: { name: "Hojas",  mat: leavesMat }
    };

    // 3. Controles de Cámara
    let isLocked = false;
    let pitch = 0, yaw = 0;

    document.addEventListener('click', () => {
      if (health > 0 && !isLocked) {
        document.body.requestPointerLock();
      }
    });

    document.addEventListener('pointerlockchange', () => {
      isLocked = (document.pointerLockElement === document.body);
    });

    document.addEventListener('mousemove', (e) => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.002;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));

      const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
      camera.quaternion.setFromEuler(euler);
    });

    // 4. Inventario y Bloques
    const inventory = { 1: 10, 2: 10, 3: 5, 4: 5, 5: 5 };
    let selectedSlot = 1;

    function updateInventoryUI() {
      for (let i = 1; i <= 5; i++) {
        document.getElementById(`count-${i}`).innerText = inventory[i];
      }
    }
    updateInventoryUI();

    const blockGeo = new THREE.BoxGeometry(1, 1, 1);
    const blocks = [];

    function getTerrainHeight(x, z) {
      return Math.floor(Math.sin(x * 0.2) * 2 + Math.cos(z * 0.2) * 2);
    }

    const WORLD_SIZE = 16;
    for (let x = -WORLD_SIZE / 2; x < WORLD_SIZE / 2; x++) {
      for (let z = -WORLD_SIZE / 2; z < WORLD_SIZE / 2; z++) {
        const height = getTerrainHeight(x, z);
        for (let y = height; y >= height - 3; y--) {
          let typeId = (y === height) ? 1 : 2;
          const cube = new THREE.Mesh(blockGeo, BLOCK_TYPES[typeId].mat);
          cube.position.set(x, y, z);
          cube.userData.typeId = typeId;
          scene.add(cube);
          blocks.push(cube);
        }
      }
    }

    // 5. Jugador y Salud
    let health = 10;
    const playerHeight = 1.6;
    camera.position.set(0, getTerrainHeight(0,0) + 10, 0);

    function updateHealthUI() {
      let heartsHtml = "";
      for (let i = 0; i < health; i++) heartsHtml += "❤️";
      for (let i = health; i < 10; i++) heartsHtml += "🖤";
      document.getElementById('health-bar').innerHTML = heartsHtml;
    }

    function takeDamage(amount) {
      if (health <= 0) return;
      health = Math.max(0, health - amount);
      updateHealthUI();
      if (health <= 0) {
        document.exitPointerLock();
        document.getElementById('game-over').style.display = 'flex';
      }
    }

    function respawnPlayer() {
      health = 10;
      updateHealthUI();
      document.getElementById('game-over').style.display = 'none';
      camera.position.set(0, getTerrainHeight(0,0) + 10, 0);
      velocityY = 0;
      document.body.requestPointerLock();
    }

    // 6. Eventos de Teclado y Mouse
    const keys = {};
    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code.startsWith('Digit')) {
        const num = parseInt(e.code.replace('Digit', ''));
        if (num >= 1 && num <= 5) selectSlot(num);
      }
    });
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    window.addEventListener('wheel', (e) => {
      selectedSlot = (e.deltaY > 0) ? (selectedSlot % 5 + 1) : ((selectedSlot - 2 + 5) % 5 + 1);
      selectSlot(selectedSlot);
    });

    function selectSlot(slotNumber) {
      selectedSlot = slotNumber;
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
      document.getElementById(`slot-${slotNumber}`).classList.add('selected');
    }

    // 7. Movimiento y Físicas
    let velocityY = 0;
    const gravity = -0.01;
    let isGrounded = false;

    function updatePhysics() {
      if (!isLocked || health <= 0) return;

      const speed = 0.08;
      const moveVector = new THREE.Vector3();

      if (keys['KeyW']) moveVector.z -= 1;
      if (keys['KeyS']) moveVector.z += 1;
      if (keys['KeyA']) moveVector.x -= 1;
      if (keys['KeyD']) moveVector.x += 1;

      moveVector.normalize();
      moveVector.applyEuler(new THREE.Euler(0, yaw, 0));
      camera.position.addScaledVector(moveVector, speed);

      velocityY += gravity;
      if (keys['Space'] && isGrounded) {
        velocityY = 0.18;
        isGrounded = false;
      }
      camera.position.y += velocityY;

      const feetY = camera.position.y - playerHeight;
      const groundY = getTerrainHeight(Math.round(camera.position.x), Math.round(camera.position.z)) + 0.5;

      if (feetY <= groundY) {
        camera.position.y = groundY + playerHeight;
        velocityY = 0;
        isGrounded = true;
      }

      if (camera.position.y < -20) takeDamage(10);
    }

    // 8. Interacción con Bloques
    const raycaster = new THREE.Raycaster();
    document.addEventListener('mousedown', (e) => {
      if (!isLocked || health <= 0) return;

      raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
      const intersects = raycaster.intersectObjects(blocks);

      if (intersects.length > 0) {
        const hit = intersects[0];

        if (e.button === 0) { 
          const target = hit.object;
          const typeId = target.userData.typeId || 1;
          inventory[typeId] = (inventory[typeId] || 0) + 1;
          updateInventoryUI();
          scene.remove(target);
          blocks.splice(blocks.indexOf(target), 1);
        } else if (e.button === 2) { 
          if (inventory[selectedSlot] > 0) {
            const normal = hit.face.normal;
            const newPos = hit.object.position.clone().add(normal);
            const newBlock = new THREE.Mesh(blockGeo, BLOCK_TYPES[selectedSlot].mat);
            newBlock.position.copy(newPos);
            newBlock.userData.typeId = selectedSlot;
            scene.add(newBlock);
            blocks.push(newBlock);
            inventory[selectedSlot]--;
            updateInventoryUI();
          }
        }
      }
    });

    document.addEventListener('contextmenu', e => e.preventDefault());

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
