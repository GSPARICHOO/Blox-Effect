<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Clon de Minecraft - Inventario Clásico</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body { 
      margin: 0; 
      overflow: hidden; 
      font-family: 'Press Start 2P', monospace; 
      background: #111; 
      user-select: none;
    }

    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 8px; height: 8px; background: white;
      transform: translate(-50%, -50%);
      pointer-events: none; mix-blend-mode: difference; z-index: 10;
    }

    #hotbar {
      position: absolute; bottom: 15px; left: 50%;
      transform: translateX(-50%); display: flex; gap: 4px;
      background: rgba(0, 0, 0, 0.6); padding: 5px; 
      border: 4px solid #3c3c3c; z-index: 10;
    }

    .slot {
      width: 44px; height: 44px; border: 3px solid #555;
      background: #8b8b8b; display: flex;
      align-items: center; justify-content: center; color: white;
      font-size: 6px; text-align: center;
      box-sizing: border-box; position: relative;
      box-shadow: inset 2px 2px 0px #373737, inset -2px -2px 0px #ffffff;
    }

    .slot.selected { 
      border-color: #ffffff; 
      box-shadow: inset 2px 2px 0px #ffffff, inset -2px -2px 0px #373737;
    }

    .slot span.key { position: absolute; top: 2px; left: 3px; font-size: 7px; color: #bbb; }
    .slot span.count { position: absolute; bottom: 2px; right: 3px; font-size: 8px; color: #ffffff; text-shadow: 1px 1px 0 #000; }

    /* Menú de Inventario Clásico */
    #classic-inventory {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); width: 380px;
      background: #c6c6c6; border: 4px solid #fff;
      border-right-color: #555; border-bottom-color: #555;
      padding: 12px; z-index: 30; flex-direction: column; gap: 12px;
      box-shadow: 0 0 25px rgba(0,0,0,0.8); color: #404040;
    }

    .inv-header { display: flex; justify-content: space-between; align-items: center; }
    .inv-title { font-size: 10px; margin: 0; color: #404040; }

    .crafting-container {
      display: flex; align-items: center; gap: 15px; background: #8b8b8b;
      padding: 10px; border: 2px solid #373737; border-right-color: #fff; border-bottom-color: #fff;
    }

    .craft-grid-2x2 { display: grid; grid-template-columns: repeat(2, 40px); gap: 4px; }
    .craft-arrow { font-size: 16px; color: #fff; text-shadow: 1px 1px 0 #000; }

    .inv-grid { display: grid; grid-template-columns: repeat(9, 36px); gap: 4px; justify-content: center; }
    .inv-slot {
      width: 36px; height: 36px; background: #8b8b8b;
      border: 2px solid #373737; border-right-color: #fff; border-bottom-color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 6px;
      position: relative; color: #fff;
    }

    #instructions {
      position: absolute; top: 10px; left: 10px; color: #fff;
      font-size: 8px; background: rgba(0,0,0,0.6); padding: 8px; z-index: 10;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="crosshair"></div>
  <div id="instructions">Presiona 'E' para Abrir Inventario | 1-9: Cambiar Slot</div>

  <!-- Hotbar de 9 ranuras -->
  <div id="hotbar">
    <div id="slot-1" class="slot selected"><span class="key">1</span><span class="name">PASTO</span><span class="count" id="count-1">10</span></div>
    <div id="slot-2" class="slot"><span class="key">2</span><span class="name">TIERRA</span><span class="count" id="count-2">10</span></div>
    <div id="slot-3" class="slot"><span class="key">3</span><span class="name">PIEDRA</span><span class="count" id="count-3">10</span></div>
    <div id="slot-4" class="slot"><span class="key">4</span><span class="name">TRONCO</span><span class="count" id="count-4">10</span></div>
    <div id="slot-5" class="slot"><span class="key">5</span><span class="name">HOJAS</span><span class="count" id="count-5">10</span></div>
    <div id="slot-6" class="slot"><span class="key">6</span><span class="name">-</span><span class="count" id="count-6">0</span></div>
    <div id="slot-7" class="slot"><span class="key">7</span><span class="name">-</span><span class="count" id="count-7">0</span></div>
    <div id="slot-8" class="slot"><span class="key">8</span><span class="name">-</span><span class="count" id="count-8">0</span></div>
    <div id="slot-9" class="slot"><span class="key">9</span><span class="name">-</span><span class="count" id="count-9">0</span></div>
  </div>

  <!-- Pantalla de Inventario Clásico estilo Beta/Alfa -->
  <div id="classic-inventory">
    <div class="inv-header">
      <span class="inv-title">Crafteo</span>
    </div>
    <div class="crafting-container">
      <div class="craft-grid-2x2">
        <div class="inv-slot"></div>
        <div class="inv-slot"></div>
        <div class="inv-slot"></div>
        <div class="inv-slot"></div>
      </div>
      <div class="craft-arrow">➡</div>
      <div class="inv-slot" style="width: 44px; height: 44px;"></div>
    </div>
    <div class="inv-header">
      <span class="inv-title">Inventario</span>
    </div>
    <!-- Matriz de 3x9 del almacenamiento -->
    <div class="inv-grid" id="main-inventory-grid"></div>
  </div>

  <script>
    // 1. Configuración de Three.js
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // Texturas Procedurales
    function createPixelTexture(baseColor, noiseColor, type) {
      const canvas = document.createElement('canvas');
      canvas.width = 16; canvas.height = 16;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = baseColor; ctx.fillRect(0, 0, 16, 16);
      for (let x = 0; x < 16; x++) {
        for (let y = 0; y < 16; y++) {
          if (Math.random() > 0.5) {
            ctx.fillStyle = noiseColor; ctx.fillRect(x, y, 1, 1);
          }
        }
      }
      if (type === 'wood') {
        ctx.fillStyle = '#3a2312';
        for (let i = 0; i < 16; i += 3) ctx.fillRect(0, i, 16, 1);
      } else if (type === 'grass_side') {
        ctx.fillStyle = '#5b8731'; ctx.fillRect(0, 0, 16, 4);
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      return texture;
    }

    const BLOCK_TYPES = {
      1: { name: "Pasto", mat: [new THREE.MeshLambertMaterial({ map: createPixelTexture('#866043','#573d2a','grass_side') }), new THREE.MeshLambertMaterial({ map: createPixelTexture('#866043','#573d2a','grass_side') }), new THREE.MeshLambertMaterial({ map: createPixelTexture('#5b8731','#4a6e27','grass') }), new THREE.MeshLambertMaterial({ map: createPixelTexture('#866043','#573d2a','dirt') }), new THREE.MeshLambertMaterial({ map: createPixelTexture('#866043','#573d2a','grass_side') }), new THREE.MeshLambertMaterial({ map: createPixelTexture('#866043','#573d2a','grass_side') })] },
      2: { name: "Tierra", mat: new THREE.MeshLambertMaterial({ map: createPixelTexture('#866043', '#573d2a', 'dirt') }) },
      3: { name: "Piedra", mat: new THREE.MeshLambertMaterial({ map: createPixelTexture('#737373', '#525252', 'stone') }) },
      4: { name: "Tronco", mat: new THREE.MeshLambertMaterial({ map: createPixelTexture('#614126', '#472d17', 'wood') }) },
      5: { name: "Hojas",  mat: new THREE.MeshLambertMaterial({ map: createPixelTexture('#2e7d32', '#1b5e20', 'leaves'), transparent: true, opacity: 0.9 }) }
    };

    const inventory = { 1: 10, 2: 10, 3: 10, 4: 10, 5: 10, 6: 0, 7: 0, 8: 0, 9: 0 };
    let selectedSlot = 1;

    // Generar cuadrícula principal de 27 slots (3x9)
    const invGridEl = document.getElementById('main-inventory-grid');
    for (let i = 0; i < 27; i++) {
      const slot = document.createElement('div');
      slot.className = 'inv-slot';
      invGridEl.appendChild(slot);
    }

    function selectSlot(slotNumber) {
      selectedSlot = slotNumber;
      document.querySelectorAll('#hotbar .slot').forEach(s => s.classList.remove('selected'));
      document.getElementById(`slot-${slotNumber}`).classList.add('selected');
    }

    let isInventoryOpen = false;
    function toggleInventory() {
      isInventoryOpen = !isInventoryOpen;
      const invEl = document.getElementById('classic-inventory');
      if (isInventoryOpen) {
        document.exitPointerLock();
        invEl.style.display = 'flex';
      } else {
        invEl.style.display = 'none';
        document.body.requestPointerLock();
      }
    }

    // Mundo y Terreno
    const blockGeo = new THREE.BoxGeometry(1, 1, 1);
    const blocks = [];
    const blockMap = new Map();

    function getBlockKey(x, y, z) { return `${Math.round(x)},${Math.round(y)},${Math.round(z)}`; }
    function getTerrainHeight(x, z) { return Math.floor(Math.sin(x * 0.15) * Math.cos(z * 0.15) * 3 + Math.sin(x * 0.05 + z * 0.05) * 4); }

    function addBlockToWorld(x, y, z, typeId) {
      if (blockMap.has(getBlockKey(x, y, z))) return;
      const mat = BLOCK_TYPES[typeId]?.mat || BLOCK_TYPES[2].mat;
      const cube = new THREE.Mesh(blockGeo, mat);
      cube.position.set(Math.round(x), Math.round(y), Math.round(z));
      cube.userData.typeId = typeId;
      scene.add(cube);
      blocks.push(cube);
      blockMap.set(getBlockKey(x, y, z), cube);
    }

    const WORLD_SIZE = 26;
    for (let x = -WORLD_SIZE / 2; x < WORLD_SIZE / 2; x++) {
      for (let z = -WORLD_SIZE / 2; z < WORLD_SIZE / 2; z++) {
        const height = getTerrainHeight(x, z);
        for (let y = height; y >= height - 4; y--) {
          let typeId = (y === height) ? 1 : ((y >= height - 2) ? 2 : 3);
          addBlockToWorld(x, y, z, typeId);
        }
      }
    }

    // Físicas y Controles
    const playerRadius = 0.18;
    const playerHeight = 1.6;
    camera.position.set(0, getTerrainHeight(0, 0) + 5, 0);

    let isLocked = false, pitch = 0, yaw = 0, velocityY = 0;
    const gravity = -0.012, jumpStrength = 0.18;
    let isGrounded = false;
    const keys = {};

    document.addEventListener('click', () => { if (!isLocked && !isInventoryOpen) document.body.requestPointerLock(); });
    document.addEventListener('pointerlockchange', () => { isLocked = (document.pointerLockElement === document.body); });

    document.addEventListener('mousemove', (e) => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.002; pitch -= e.movementY * 0.002;
      pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
      camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
    });

    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyE') toggleInventory();
      if (e.code.startsWith('Digit')) {
        const num = parseInt(e.code.replace('Digit', ''));
        if (num >= 1 && num <= 9) selectSlot(num);
      }
    });
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    function getPlayerAABB(pos) {
      return { minX: pos.x - playerRadius, maxX: pos.x + playerRadius, minY: pos.y - playerHeight, maxY: pos.y + 0.1, minZ: pos.z - playerRadius, maxZ: pos.z + playerRadius };
    }
    function isColliding(b1, b2) {
      return (b1.minX < b2.maxX && b1.maxX > b2.minX && b1.minY < b2.maxY && b1.maxY > b2.minY && b1.minZ < b2.maxZ && b1.maxZ > b2.minZ);
    }

    function updatePhysics() {
      if (!isLocked) return;
      const speed = 0.08;
      const moveVector = new THREE.Vector3();
      if (keys['KeyW']) moveVector.z -= 1; if (keys['KeyS']) moveVector.z += 1;
      if (keys['KeyA']) moveVector.x -= 1; if (keys['KeyD']) moveVector.x += 1;

      if (moveVector.lengthSq() > 0) {
        moveVector.normalize();
        moveVector.applyEuler(new THREE.Euler(0, yaw, 0));
      }

      camera.position.x += moveVector.x * speed;
      camera.position.z += moveVector.z * speed;

      velocityY += gravity;
      if (keys['Space'] && isGrounded) { velocityY = jumpStrength; isGrounded = false; }
      camera.position.y += velocityY;

      // Suelo simple
      const currentGround = getTerrainHeight(camera.position.x, camera.position.z) + 1 + playerHeight;
      if (camera.position.y <= currentGround) {
        camera.position.y = currentGround;
        velocityY = 0;
        isGrounded = true;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
