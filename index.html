<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Clon de Minecraft - Supervivencia Alpha</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      width: 10px; height: 10px;
      background: white;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: difference;
    }
    #instructions {
      position: absolute;
      top: 20px; left: 20px;
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border-radius: 8px;
    }
    #ui-container {
      position: absolute;
      bottom: 75px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    #health-bar {
      display: flex;
      gap: 4px;
      font-size: 20px;
    }
    #hotbar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px;
      border-radius: 8px;
    }
    .slot {
      width: 50px;
      height: 50px;
      border: 3px solid #555;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 10px;
      text-align: center;
      box-sizing: border-box;
      position: relative;
    }
    .slot.selected {
      border-color: #fff;
      box-shadow: 0 0 8px #fff;
    }
    .slot span.key {
      position: absolute;
      top: 2px;
      left: 4px;
      font-size: 9px;
      text-shadow: 1px 1px 2px black;
    }
    .slot span.count {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 11px;
      color: #ffde59;
      text-shadow: 1px 1px 2px black;
    }
    #game-over {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(150, 0, 0, 0.7);
      color: white;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 30px;
    }
    #game-over button {
      margin-top: 20px; padding: 10px 20px;
      font-size: 18px; cursor: pointer;
      border: none; background: white; border-radius: 5px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

  <div id="crosshair"></div>
  <div id="instructions">
    <b>Haz clic en la pantalla para jugar</b><br>
    W, A, S, D: Moverse | Espacio: Saltar<br>
    <b>Teclas 1 - 5 / Rueda del mouse: Cambiar bloque</b><br>
    Clic Izquierdo: Romper y Recolectar | Clic Derecho: Poner
  </div>

  <div id="ui-container">
    <div id="health-bar">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
  </div>

  <div id="hotbar">
    <div id="slot-1" class="slot selected"><span class="key">1</span>Pasto<span class="count" id="count-1">0</span></div>
    <div id="slot-2" class="slot"><span class="key">2</span>Tierra<span class="count" id="count-2">0</span></div>
    <div id="slot-3" class="slot"><span class="key">3</span>Piedra<span class="count" id="count-3">0</span></div>
    <div id="slot-4" class="slot"><span class="key">4</span>Madera<span class="count" id="count-4">0</span></div>
    <div id="slot-5" class="slot"><span class="key">5</span>Hojas<span class="count" id="count-5">0</span></div>
  </div>

  <div id="game-over">
    <h1>¡HAS MUERTO!</h1>
    <button onclick="respawnPlayer()">Reaparecer</button>
  </div>

  <script>
    // 1. Texturas Pixel Art
    // 1. Generador de Texturas Auténticas de Minecraft Alpha 1.0.11
function createAlphaTexture(type) {
  const canvas = document.createElement('canvas');
  canvas.width = 16;
  canvas.height = 16;
  const ctx = canvas.getContext('2d');

  // Paleta de Colores de Alpha 1.0.11
  const alphaColors = {
    grassTop: '#7cbd6b',    // Verde neón clásico de Alpha
    dirt: '#866043',        // Tierra marrón oscuro
    stone: '#737373',       // Piedra gris neutro
    woodSide: '#675231',    // Corteza de roble
    woodTop: '#9c8251',     // Anillos de madera
    leaves: '#388b2a'       // Hojas oscuras estilo Alpha
  };

  for (let x = 0; x < 16; x++) {
    for (let y = 0; y < 16; y++) {
      let color = '#ffffff';
      const rand = (Math.random() - 0.5) * 20;

      if (type === 'grass_top') {
        color = adjustColor(alphaColors.grassTop, rand);
      } else if (type === 'dirt') {
        color = adjustColor(alphaColors.dirt, rand);
      } else if (type === 'stone') {
        const noise = (Math.random() - 0.5) * 35;
        color = adjustColor(alphaColors.stone, noise);
      } else if (type === 'leaves') {
        // Hojas con transparencia interna estilo Alpha
        if ((x + y) % 3 === 0 && Math.random() > 0.4) {
          color = adjustColor('#2a6b1f', rand);
        } else {
          color = adjustColor(alphaColors.leaves, rand);
        }
      } else if (type === 'wood_side') {
        // Lineas verticales para la corteza
        const stripe = (x % 4 === 0) ? -25 : 0;
        color = adjustColor(alphaColors.woodSide, rand + stripe);
      } else if (type === 'wood_top') {
        // Anillos concéntricos de madera
        const dist = Math.sqrt((x - 7.5)**2 + (y - 7.5)**2);
        const ring = (Math.floor(dist) % 2 === 0) ? -15 : 10;
        color = adjustColor(alphaColors.woodTop, ring);
      } else if (type === 'grass_side') {
        // Lateral de pasto: capa de pasto arriba, tierra abajo
        if (y < 4 + Math.sin(x * 0.8) * 1.5) {
          color = adjustColor(alphaColors.grassTop, rand);
        } else {
          color = adjustColor(alphaColors.dirt, rand);
        }
      }

      ctx.fillStyle = color;
      ctx.fillRect(x, y, 1, 1);
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.magFilter = THREE.NearestFilter; // Mantiene los píxeles nítidos
  texture.minFilter = THREE.NearestFilter;
  return texture;
}

// Auxiliar para variar el brillo de los píxeles
function adjustColor(hex, amount) {
  let num = parseInt(hex.replace('#', ''), 16);
  let r = Math.min(255, Math.max(0, (num >> 16) + amount));
  let g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
  let b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

// 3. Bloques Multicaras de Alpha 1.0.11 (Textura arriba/lados/abajo)
const texGrassTop = createAlphaTexture('grass_top');
const texGrassSide = createAlphaTexture('grass_side');
const texDirt = createAlphaTexture('dirt');
const texStone = createAlphaTexture('stone');
const texWoodSide = createAlphaTexture('wood_side');
const texWoodTop = createAlphaTexture('wood_top');
const texLeaves = createAlphaTexture('leaves');

// Material del Bloque de Pasto (6 lados)
const grassMaterials = [
  new THREE.MeshLambertMaterial({ map: texGrassSide }), // Derecha
  new THREE.MeshLambertMaterial({ map: texGrassSide }), // Izquierda
  new THREE.MeshLambertMaterial({ map: texGrassTop }),  // Arriba
  new THREE.MeshLambertMaterial({ map: texDirt }),      // Abajo
  new THREE.MeshLambertMaterial({ map: texGrassSide }), // Frente
  new THREE.MeshLambertMaterial({ map: texGrassSide })  // Atrás
];

// Material del Tronco de Madera (6 lados)
const woodMaterials = [
  new THREE.MeshLambertMaterial({ map: texWoodSide }),
  new THREE.MeshLambertMaterial({ map: texWoodSide }),
  new THREE.MeshLambertMaterial({ map: texWoodTop }),
  new THREE.MeshLambertMaterial({ map: texWoodTop }),
  new THREE.MeshLambertMaterial({ map: texWoodSide }),
  new THREE.MeshLambertMaterial({ map: texWoodSide })
];

const dirtMat = new THREE.MeshLambertMaterial({ map: texDirt });
const stoneMat = new THREE.MeshLambertMaterial({ map: texStone });
const leavesMat = new THREE.MeshLambertMaterial({ map: texLeaves, transparent: true, alphaTest: 0.1 });

const BLOCK_TYPES = {
  1: { name: "Pasto", mat: grassMaterials },
  2: { name: "Tierra", mat: dirtMat },
  3: { name: "Piedra", mat: stoneMat },
  4: { name: "Madera", mat: woodMaterials },
  5: { name: "Hojas", mat: leavesMat }
};
    // 2. Configuración de Escena
    const scene = new THREE.Scene();
    const dayColor = new THREE.Color(0x87ceeb);
    const nightColor = new THREE.Color(0x050510);
    scene.background = dayColor.clone();

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
    scene.add(sunLight);

    const sunMesh = new THREE.Mesh(
      new THREE.BoxGeometry(4, 4, 4),
      new THREE.MeshBasicMaterial({ color: 0xffdd44 })
    );
    scene.add(sunMesh);

    const controls = new THREE.PointerLockControls(camera, document.body);
    document.addEventListener('click', () => {
      if (health > 0) controls.lock();
    });

    // 3. Materiales y Tipos de Bloques
    const grassMat = new THREE.MeshLambertMaterial({ map: createPixelTexture(0x7cbd6b, 30) });
    const dirtMat = new THREE.MeshLambertMaterial({ map: createPixelTexture(0x8b5a2b, 40) });
    const stoneMat = new THREE.MeshLambertMaterial({ map: createPixelTexture(0x777777, 50) });
    const woodMat = new THREE.MeshLambertMaterial({ map: createPixelTexture(0xa0522d, 35) });
    const leavesMat = new THREE.MeshLambertMaterial({ map: createPixelTexture(0x4aed43, 40) });

    const BLOCK_TYPES = {
      1: { name: "Pasto", mat: grassMat },
      2: { name: "Tierra", mat: dirtMat },
      3: { name: "Piedra", mat: stoneMat },
      4: { name: "Madera", mat: woodMat },
      5: { name: "Hojas", mat: leavesMat }
    };

    // Inventario del Jugador
    const inventory = { 1: 5, 2: 10, 3: 0, 4: 0, 5: 0 }; // Inicias con algunos bloques
    let selectedSlot = 1;

    function updateInventoryUI() {
      for (let i = 1; i <= 5; i++) {
        document.getElementById(`count-${i}`).innerText = inventory[i];
      }
    }
    updateInventoryUI();

    const blockGeo = new THREE.BoxGeometry(1, 1, 1);
    const blocks = [];

    // 4. Generador de Terreno
    function getTerrainHeight(x, z) {
      const wave1 = Math.sin(x * 0.15) * Math.cos(z * 0.15) * 3;
      const wave2 = Math.sin(x * 0.05 + z * 0.05) * 4;
      return Math.floor(wave1 + wave2);
    }

    function createTree(treeX, treeY, treeZ) {
      for (let y = 1; y <= 4; y++) {
        const trunk = new THREE.Mesh(blockGeo, woodMat);
        trunk.position.set(treeX, treeY + y, treeZ);
        trunk.userData.typeId = 4;
        scene.add(trunk);
        blocks.push(trunk);
      }
      for (let lx = -1; lx <= 1; lx++) {
        for (let lz = -1; lz <= 1; lz++) {
          for (let ly = 4; ly <= 5; ly++) {
            if (lx === 0 && lz === 0 && ly === 4) continue;
            const leaf = new THREE.Mesh(blockGeo, leavesMat);
            leaf.position.set(treeX + lx, treeY + ly, treeZ + lz);
            leaf.userData.typeId = 5;
            scene.add(leaf);
            blocks.push(leaf);
          }
        }
      }
    }

    const WORLD_SIZE = 24;
    for (let x = -WORLD_SIZE / 2; x < WORLD_SIZE / 2; x++) {
      for (let z = -WORLD_SIZE / 2; z < WORLD_SIZE / 2; z++) {
        const height = getTerrainHeight(x, z);
        for (let y = height; y >= height - 5; y--) {
          let typeId = 3;
          if (y === height) typeId = 1;
          else if (y >= height - 2) typeId = 2;

          const cube = new THREE.Mesh(blockGeo, BLOCK_TYPES[typeId].mat);
          cube.position.set(x, y, z);
          cube.userData.typeId = typeId;
          scene.add(cube);
          blocks.push(cube);
        }
        if (Math.random() < 0.03 && Math.abs(x) > 2 && Math.abs(z) > 2) {
          createTree(x, height, z);
        }
      }
    }

    // 5. Sistema de Vida y Supervivencia
    let health = 10;
    const playerHeight = 1.6;
    const playerRadius = 0.3;

    function updateHealthUI() {
      let heartsHtml = "";
      for (let i = 0; i < health; i++) heartsHtml += "❤️";
      for (let i = health; i < 10; i++) heartsHtml += "🖤";
      document.getElementById('health-bar').innerHTML = heartsHtml;
    }

    function takeDamage(amount) {
      if (health <= 0) return;
      health = Math.max(0, health - amount);
      updateHealthUI();

      if (health <= 0) {
        controls.unlock();
        document.getElementById('game-over').style.display = 'flex';
      }
    }

    function respawnPlayer() {
      health = 10;
      updateHealthUI();
      document.getElementById('game-over').style.display = 'none';
      const safeY = getTerrainHeight(0, 0) + 3;
      camera.position.set(0, safeY, 0);
      velocityY = 0;
      controls.lock();
    }

    const safeY = getTerrainHeight(0, 0) + 3;
    camera.position.set(0, safeY, 0);

    // 6. Controles y Selección
    const keys = {};
    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code.startsWith('Digit')) {
        const num = parseInt(e.code.replace('Digit', ''));
        if (num >= 1 && num <= 5) selectSlot(num);
      }
    });
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    // Rueda del ratón para cambiar de slot
    window.addEventListener('wheel', (e) => {
      if (e.deltaY > 0) {
        selectedSlot = selectedSlot % 5 + 1;
      } else {
        selectedSlot = (selectedSlot - 2 + 5) % 5 + 1;
      }
      selectSlot(selectedSlot);
    });

    function selectSlot(slotNumber) {
      selectedSlot = slotNumber;
      document.querySelectorAll('.slot').forEach(slot => slot.classList.remove('selected'));
      document.getElementById(`slot-${slotNumber}`).classList.add('selected');
    }

    // 7. Físicas con Daño por Caída
    let velocityY = 0;
    const gravity = -0.012;
    const jumpStrength = 0.22;
    let isGrounded = false;
    let lastFallVelocity = 0;

    function checkHorizontalCollision(moveVector) {
      const checkHeights = [0.2, 1.0]; 
      for (let heightOffset of checkHeights) {
        const rayOrigin = camera.position.clone();
        rayOrigin.y -= (playerHeight - heightOffset);
        const raycaster = new THREE.Raycaster(rayOrigin, moveVector.clone().normalize(), 0, playerRadius + 0.1);
        if (raycaster.intersectObjects(blocks).length > 0) return true;
      }
      return false;
    }

    function updatePhysicsAndPlayer() {
      if (!controls.isLocked || health <= 0) return;

      const speed = 0.1;
      const moveDirection = new THREE.Vector3();

      if (keys['KeyW']) moveDirection.z += 1;
      if (keys['KeyS']) moveDirection.z -= 1;
      if (keys['KeyA']) moveDirection.x -= 1;
      if (keys['KeyD']) moveDirection.x += 1;

      if (moveDirection.lengthSq() > 0) {
        moveDirection.normalize();
        if (keys['KeyW'] || keys['KeyS']) {
          const forwardDir = new THREE.Vector3();
          camera.getWorldDirection(forwardDir);
          forwardDir.y = 0;
          forwardDir.normalize();
          if (keys['KeyS']) forwardDir.negate();
          if (!checkHorizontalCollision(forwardDir)) controls.moveForward(keys['KeyW'] ? speed : -speed);
        }
        if (keys['KeyA'] || keys['KeyD']) {
          const sideDir = new THREE.Vector3();
          camera.getWorldDirection(sideDir);
          sideDir.y = 0;
          sideDir.cross(camera.up).normalize();
          if (keys['KeyA']) sideDir.negate();
          if (!checkHorizontalCollision(sideDir)) controls.moveRight(keys['KeyD'] ? speed : -speed);
        }
      }

      velocityY += gravity;

      if (keys['Space'] && isGrounded) {
        velocityY = jumpStrength;
        isGrounded = false;
      }

      camera.position.y += velocityY;

      // Guardar velocidad de caída
      if (velocityY < 0) lastFallVelocity = velocityY;

      const feetPosition = camera.position.clone();
      feetPosition.y -= (playerHeight - 0.2);

      if (velocityY <= 0) {
        const downRaycaster = new THREE.Raycaster(feetPosition, new THREE.Vector3(0, -1, 0), 0, 0.35);
        const intersections = downRaycaster.intersectObjects(blocks);

        if (intersections.length > 0) {
          const hit = intersections[0];
          if (hit.face.normal.y > 0.5) {
            // Cálculo de Daño por Caída
            if (lastFallVelocity < -0.38) {
              const fallDamage = Math.floor(Math.abs(lastFallVelocity) * 18);
              takeDamage(fallDamage);
            }
            lastFallVelocity = 0;

            camera.position.y = hit.point.y + playerHeight;
            velocityY = 0;
            isGrounded = true;
          }
        } else {
          isGrounded = false;
        }
      }

      // Muerte por caída al vacío
      if (camera.position.y < -30) {
        takeDamage(10);
      }
    }

    // 8. Ciclo Día / Noche
    let time = 0;
    function updateDayNightCycle() {
      time += 0.002;
      const radius = 80;
      const sunX = Math.cos(time) * radius;
      const sunY = Math.sin(time) * radius;

      sunLight.position.set(sunX, sunY, 0);
      sunMesh.position.set(sunX, sunY, 0);

      const dayFactor = Math.max(0, Math.min(1, (Math.sin(time) + 0.2) / 0.7));
      scene.background.lerpColors(nightColor, dayColor, dayFactor);
      sunLight.intensity = dayFactor * 0.8;
      ambientLight.intensity = 0.1 + (dayFactor * 0.4);
    }

    // 9. Romper (Recolectar) y Poner Bloques
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(0, 0);

    document.addEventListener('mousedown', (e) => {
      if (!controls.isLocked || health <= 0) return;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(blocks);

      if (intersects.length > 0) {
        const hit = intersects[0];

        // Clic Izquierdo: Romper bloque y sumarlo al inventario
        if (e.button === 0) { 
          const target = hit.object;
          const typeId = target.userData.typeId || 1;

          inventory[typeId] = (inventory[typeId] || 0) + 1;
          updateInventoryUI();

          scene.remove(target);
          blocks.splice(blocks.indexOf(target), 1);
        } 
        // Clic Derecho: Poner bloque restando del inventario
        else if (e.button === 2) { 
          if (inventory[selectedSlot] > 0) {
            const targetBlock = hit.object;
            const normal = hit.face.normal;

            const newX = targetBlock.position.x + normal.x;
            const newY = targetBlock.position.y + normal.y;
            const newZ = targetBlock.position.z + normal.z;

            const newBlock = new THREE.Mesh(blockGeo, BLOCK_TYPES[selectedSlot].mat);
            newBlock.position.set(newX, newY, newZ);
            newBlock.userData.typeId = selectedSlot;

            scene.add(newBlock);
            blocks.push(newBlock);

            inventory[selectedSlot]--;
            updateInventoryUI();
          }
        }
      }
    });

    document.addEventListener('contextmenu', e => e.preventDefault());

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      updatePhysicsAndPlayer();
      updateDayNightCycle();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
