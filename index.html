<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Clon de Minecraft - Arreglado</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body { 
      margin: 0; 
      overflow: hidden; 
      font-family: 'Press Start 2P', 'Courier New', monospace; 
      background: #111; 
      user-select: none;
    }

    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 8px; height: 8px; background: white;
      transform: translate(-50%, -50%);
      pointer-events: none; mix-blend-mode: difference; z-index: 10;
    }

    #hotbar {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%); display: flex; gap: 6px;
      background: rgba(0, 0, 0, 0.85); padding: 6px; 
      border: 4px solid #333; z-index: 10;
    }

    .slot {
      width: 52px; height: 52px; border: 3px solid #555;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: white;
      font-size: 7px; text-align: center;
      box-sizing: border-box; position: relative; background: rgba(255,255,255,0.05);
      line-height: 1.2; text-shadow: 1px 1px 0px #000;
    }

    .slot.selected { 
      border-color: #ffffff; 
      box-shadow: inset 0 0 0 2px #ffffff;
      background: rgba(255,255,255,0.2);
    }

    .slot span.key { position: absolute; top: 3px; left: 4px; font-size: 8px; color: #aaa; }
    .slot span.count { position: absolute; bottom: 3px; right: 4px; font-size: 9px; color: #ffde59; }

    #instructions {
      position: absolute; top: 10px; left: 10px; color: #fff;
      font-size: 8px; background: rgba(0,0,0,0.6); padding: 8px; z-index: 10;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="crosshair"></div>
  <div id="instructions">W/A/S/D: Moverse | Espacio: Saltar | Clic Izq: Romper | Clic Der: Poner</div>

  <div id="hotbar">
    <div id="slot-1" class="slot selected"><span class="key">1</span><span class="name">PASTO</span><span class="count" id="count-1">10</span></div>
    <div id="slot-2" class="slot"><span class="key">2</span><span class="name">TIERRA</span><span class="count" id="count-2">10</span></div>
    <div id="slot-3" class="slot"><span class="key">3</span><span class="name">PIEDRA</span><span class="count" id="count-3">10</span></div>
    <div id="slot-4" class="slot"><span class="key">4</span><span class="name">TRONCO</span><span class="count" id="count-4">10</span></div>
    <div id="slot-5" class="slot"><span class="key">5</span><span class="name">HOJAS</span><span class="count" id="count-5">10</span></div>
  </div>

  <script>
    // 1. Escena
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // 2. Generador procedural de texturas de 16x16 pixels
    function createPixelTexture(baseColor, noiseColor, type) {
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 16;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, 16, 16);

      // Ruido de píxeles
      for (let x = 0; x < 16; x++) {
        for (let y = 0; y < 16; y++) {
          if (Math.random() > 0.5) {
            ctx.fillStyle = noiseColor;
            ctx.fillRect(x, y, 1, 1);
          }
        }
      }

      // Detalles específicos por bloque
      if (type === 'wood') {
        ctx.fillStyle = '#3a2312';
        for (let i = 0; i < 16; i += 3) ctx.fillRect(0, i, 16, 1);
      } else if (type === 'grass_side') {
        ctx.fillStyle = '#5b8731';
        ctx.fillRect(0, 0, 16, 4);
        for (let x = 0; x < 16; x += 2) ctx.fillRect(x, 4, 1, 2);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      return texture;
    }

    const texGrassTop  = createPixelTexture('#5b8731', '#4a6e27', 'grass');
    const texDirt      = createPixelTexture('#866043', '#573d2a', 'dirt');
    const texGrassSide = createPixelTexture('#866043', '#573d2a', 'grass_side');
    const texStone     = createPixelTexture('#737373', '#525252', 'stone');
    const texWood      = createPixelTexture('#614126', '#472d17', 'wood');
    const texLeaves    = createPixelTexture('#2e7d32', '#1b5e20', 'leaves');

    const BLOCK_TYPES = {
      1: { 
        name: "Pasto", 
        mat: [
          new THREE.MeshLambertMaterial({ map: texGrassSide }),
          new THREE.MeshLambertMaterial({ map: texGrassSide }),
          new THREE.MeshLambertMaterial({ map: texGrassTop }),
          new THREE.MeshLambertMaterial({ map: texDirt }),
          new THREE.MeshLambertMaterial({ map: texGrassSide }),
          new THREE.MeshLambertMaterial({ map: texGrassSide })
        ]
      },
      2: { name: "Tierra", mat: new THREE.MeshLambertMaterial({ map: texDirt }) },
      3: { name: "Piedra", mat: new THREE.MeshLambertMaterial({ map: texStone }) },
      4: { name: "Tronco", mat: new THREE.MeshLambertMaterial({ map: texWood }) },
      5: { name: "Hojas",  mat: new THREE.MeshLambertMaterial({ map: texLeaves, transparent: true, opacity: 0.9 }) }
    };

    const inventory = { 1: 10, 2: 10, 3: 10, 4: 10, 5: 10 };
    let selectedSlot = 1;

    function selectSlot(slotNumber) {
      selectedSlot = slotNumber;
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
      document.getElementById(`slot-${slotNumber}`).classList.add('selected');
    }

    // 3. Generación del Mundo
    const blockGeo = new THREE.BoxGeometry(1, 1, 1);
    const blocks = [];
    const blockMap = new Map();

    function getBlockKey(x, y, z) { return `${Math.round(x)},${Math.round(y)},${Math.round(z)}`; }
    function getTerrainHeight(x, z) { return Math.floor(Math.sin(x * 0.15) * Math.cos(z * 0.15) * 3 + Math.sin(x * 0.05 + z * 0.05) * 4); }

    function addBlockToWorld(x, y, z, typeId) {
      if (blockMap.has(getBlockKey(x, y, z))) return;
      const mat = BLOCK_TYPES[typeId]?.mat || BLOCK_TYPES[2].mat;
      const cube = new THREE.Mesh(blockGeo, mat);
      cube.position.set(Math.round(x), Math.round(y), Math.round(z));
      cube.userData.typeId = typeId;
      scene.add(cube);
      blocks.push(cube);
      blockMap.set(getBlockKey(x, y, z), cube);
      return cube;
    }

    function removeBlockFromWorld(block) {
      const pos = block.position;
      blockMap.delete(getBlockKey(pos.x, pos.y, pos.z));
      scene.remove(block);
      const index = blocks.indexOf(block);
      if (index > -1) blocks.splice(index, 1);
    }

    const WORLD_SIZE = 30;
    for (let x = -WORLD_SIZE / 2; x < WORLD_SIZE / 2; x++) {
      for (let z = -WORLD_SIZE / 2; z < WORLD_SIZE / 2; z++) {
        const height = getTerrainHeight(x, z);
        for (let y = height; y >= height - 4; y--) {
          let typeId = 3; // Piedra en el fondo
          if (y === height) typeId = 1; // Pasto arriba
          else if (y >= height - 2) typeId = 2; // Tierra al medio
          addBlockToWorld(x, y, z, typeId);
        }

        // Árboles
        if (Math.random() < 0.02 && Math.abs(x) > 2 && Math.abs(z) > 2) {
          const startY = height + 1;
          for (let ty = 0; ty < 4; ty++) addBlockToWorld(x, startY + ty, z, 4); // Troncos
          for (let lx = -1; lx <= 1; lx++) {
            for (let lz = -1; lz <= 1; lz++) {
              for (let ly = 2; ly <= 3; ly++) {
                if (lx !== 0 || lz !== 0 || ly === 3) addBlockToWorld(x + lx, startY + ly, z + lz, 5); // Hojas
              }
            }
          }
        }
      }
    }

    // 4. Jugador y Físicas Corregidas
    const playerHeight = 1.6;
    const playerRadius = 0.18; // Radio reducido para evitar trabarse en esquinas
    camera.position.set(0, getTerrainHeight(0, 0) + 5, 0);

    let isLocked = false;
    let pitch = 0, yaw = 0;

    document.addEventListener('click', () => {
      if (!isLocked) document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      isLocked = (document.pointerLockElement === document.body);
    });

    document.addEventListener('mousemove', (e) => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.002;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
      camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
    });

    const keys = {};
    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code.startsWith('Digit')) {
        const num = parseInt(e.code.replace('Digit', ''));
        if (num >= 1 && num <= 5) selectSlot(num);
      }
    });
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    let velocityY = 0;
    const gravity = -0.012;
    const jumpStrength = 0.18;
    let isGrounded = false;

    function getPlayerAABB(pos) {
      return {
        minX: pos.x - playerRadius, maxX: pos.x + playerRadius,
        minY: pos.y - playerHeight, maxY: pos.y + 0.1,
        minZ: pos.z - playerRadius, maxZ: pos.z + playerRadius
      };
    }

    function isColliding(b1, b2) {
      return (b1.minX < b2.maxX && b1.maxX > b2.minX && 
              b1.minY < b2.maxY && b1.maxY > b2.minY && 
              b1.minZ < b2.maxZ && b1.maxZ > b2.minZ);
    }

    function getNearbyBlockBoxes(pos) {
      const blockBoxes = [];
      const minX = Math.floor(pos.x - 1.5), maxX = Math.ceil(pos.x + 1.5);
      const minY = Math.floor(pos.y - playerHeight - 1), maxY = Math.ceil(pos.y + 1);
      const minZ = Math.floor(pos.z - 1.5), maxZ = Math.ceil(pos.z + 1.5);

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          for (let z = minZ; z <= maxZ; z++) {
            if (blockMap.has(getBlockKey(x, y, z))) {
              blockBoxes.push({ 
                minX: x - 0.5, maxX: x + 0.5, 
                minY: y - 0.5, maxY: y + 0.5, 
                minZ: z - 0.5, maxZ: z + 0.5 
              });
            }
          }
        }
      }
      return blockBoxes;
    }

    function updatePhysics() {
      if (!isLocked) return;

      const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 0.12 : 0.08;

      const moveVector = new THREE.Vector3();
      if (keys['KeyW']) moveVector.z -= 1;
      if (keys['KeyS']) moveVector.z += 1;
      if (keys['KeyA']) moveVector.x -= 1;
      if (keys['KeyD']) moveVector.x += 1;

      if (moveVector.lengthSq() > 0) {
        moveVector.normalize();
        moveVector.applyEuler(new THREE.Euler(0, yaw, 0));
      }

      // Eje X
      camera.position.x += moveVector.x * speed;
      let playerBox = getPlayerAABB(camera.position);
      let nearbyBlocks = getNearbyBlockBoxes(camera.position);

      for (const b of nearbyBlocks) {
        if (isColliding(playerBox, b)) {
          // STEP ASSIST: Si colisiona con un escalón bajo, sube automáticamente
          if (b.maxY - (camera.position.y - playerHeight) <= 0.6) {
            camera.position.y = b.maxY + playerHeight;
          } else {
            if (moveVector.x > 0) camera.position.x = b.minX - playerRadius;
            else if (moveVector.x < 0) camera.position.x = b.maxX + playerRadius;
          }
          playerBox = getPlayerAABB(camera.position);
        }
      }

      // Eje Z
      camera.position.z += moveVector.z * speed;
      playerBox = getPlayerAABB(camera.position);

      for (const b of nearbyBlocks) {
        if (isColliding(playerBox, b)) {
          // STEP ASSIST en eje Z
          if (b.maxY - (camera.position.y - playerHeight) <= 0.6) {
            camera.position.y = b.maxY + playerHeight;
          } else {
            if (moveVector.z > 0) camera.position.z = b.minZ - playerRadius;
            else if (moveVector.z < 0) camera.position.z = b.maxZ + playerRadius;
          }
          playerBox = getPlayerAABB(camera.position);
        }
      }

      // Gravedad y Salto
      velocityY += gravity;
      if (keys['Space'] && isGrounded) {
        velocityY = jumpStrength;
        isGrounded = false;
      }

      camera.position.y += velocityY;
      playerBox = getPlayerAABB(camera.position);
      nearbyBlocks = getNearbyBlockBoxes(camera.position);
      isGrounded = false;

      for (const b of nearbyBlocks) {
        if (isColliding(playerBox, b)) {
          if (velocityY < 0) {
            camera.position.y = b.maxY + playerHeight;
            velocityY = 0;
            isGrounded = true;
          } else if (velocityY > 0) {
            camera.position.y = b.minY - 0.1;
            velocityY = 0;
          }
          break;
        }
      }

      if (camera.position.y < -20) {
        camera.position.set(0, getTerrainHeight(0, 0) + 5, 0);
        velocityY = 0;
      }
    }

    // 5. Interacción (Minar / Construir)
    const raycaster = new THREE.Raycaster();
    document.addEventListener('mousedown', (e) => {
      if (!isLocked) return;

      raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
      const intersects = raycaster.intersectObjects(blocks);

      if (intersects.length > 0) {
        const hit = intersects[0];

        if (e.button === 0) { // Romper
          const target = hit.object;
          const typeId = target.userData.typeId || 1;
          inventory[typeId] = (inventory[typeId] || 0) + 1;
          document.getElementById(`count-${typeId}`).innerText = inventory[typeId];
          removeBlockFromWorld(target);
        } 
        else if (e.button === 2) { // Poner
          if (inventory[selectedSlot] > 0) {
            const normal = hit.face.normal;
            const newPos = hit.object.position.clone().add(normal);
            const x = Math.round(newPos.x);
            const y = Math.round(newPos.y);
            const z = Math.round(newPos.z);

            const newBlockBox = { minX: x - 0.5, maxX: x + 0.5, minY: y - 0.5, maxY: y + 0.5, minZ: z - 0.5, maxZ: z + 0.5 };
            if (!isColliding(getPlayerAABB(camera.position), newBlockBox)) {
              addBlockToWorld(x, y, z, selectedSlot);
              inventory[selectedSlot]--;
              document.getElementById(`count-${selectedSlot}`).innerText = inventory[selectedSlot];
            }
          }
        }
      }
    });

    document.addEventListener('contextmenu', e => e.preventDefault());

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
