<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Clon de Minecraft - Colores Planos y Límite de Colina</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body { 
      margin: 0; 
      overflow: hidden; 
      font-family: 'Press Start 2P', 'Courier New', monospace; 
      background: #111; 
      user-select: none;
    }

    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 8px; height: 8px; background: white;
      transform: translate(-50%, -50%);
      pointer-events: none; mix-blend-mode: difference; z-index: 10;
      image-rendering: pixelated;
    }

    #ui-container {
      position: absolute; bottom: 85px; left: 50%;
      transform: translateX(-50%); display: flex;
      flex-direction: column; align-items: center; gap: 5px; z-index: 10;
    }

    #health-bar { display: flex; gap: 4px; }
    .pixel-heart { width: 20px; height: 20px; image-rendering: pixelated; }

    #hotbar {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%); display: flex; gap: 6px;
      background: rgba(0, 0, 0, 0.85); padding: 6px; 
      border: 4px solid #333; z-index: 10;
      image-rendering: pixelated;
    }

    .slot {
      width: 52px; height: 52px; border: 3px solid #555;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: white;
      font-weight: bold; font-size: 7px; text-align: center;
      box-sizing: border-box; position: relative; background: rgba(255,255,255,0.05);
      line-height: 1.2; text-shadow: 1px 1px 0px #000;
    }

    .slot.selected { 
      border-color: #ffffff; 
      box-shadow: inset 0 0 0 2px #ffffff;
      background: rgba(255,255,255,0.2);
    }

    .slot span.key { position: absolute; top: 3px; left: 4px; font-size: 8px; color: #aaa; }
    .slot span.count { position: absolute; bottom: 3px; right: 4px; font-size: 9px; color: #ffde59; }

    #crafting-menu {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); width: 420px;
      background: rgba(30, 30, 30, 0.95); border: 4px solid #555;
      color: white; padding: 15px; z-index: 30; flex-direction: column;
      gap: 10px; image-rendering: pixelated; box-shadow: 0 0 20px #000;
    }

    #crafting-menu h2 { font-size: 12px; margin: 0 0 10px 0; text-align: center; color: #ffde59; }

    .recipe-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
    .recipe-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #222; padding: 8px; border: 2px solid #444; font-size: 8px;
    }

    .recipe-btn {
      background: #555; color: white; border: 2px solid #888;
      font-family: 'Press Start 2P', monospace; font-size: 8px; padding: 6px; cursor: pointer;
    }
    .recipe-btn:hover { background: #777; }

    #game-over {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(150, 0, 0, 0.85); color: white; flex-direction: column;
      justify-content: center; align-items: center; font-size: 20px; z-index: 20;
      text-shadow: 3px 3px 0px #000;
    }

    #game-over button {
      margin-top: 25px; padding: 12px 24px; font-size: 12px; cursor: pointer;
      border: 4px solid #000; background: #fff; font-family: 'Press Start 2P', monospace;
      box-shadow: 4px 4px 0px #000;
    }

    #instructions {
      position: absolute; top: 10px; left: 10px; color: #fff;
      font-size: 8px; background: rgba(0,0,0,0.6); padding: 8px; z-index: 10;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="crosshair"></div>
  <div id="instructions">Presiona 'E' para Abrir Crafteo | Zona limitada al subir la colina</div>

  <div id="ui-container">
    <div id="health-bar"></div>
  </div>

  <div id="hotbar">
    <div id="slot-1" class="slot selected"><span class="key">1</span><span class="name">PASTO</span><span class="count" id="count-1">0</span></div>
    <div id="slot-2" class="slot"><span class="key">2</span><span class="name">TIERRA</span><span class="count" id="count-2">0</span></div>
    <div id="slot-3" class="slot"><span class="key">3</span><span class="name">PIEDRA</span><span class="count" id="count-3">0</span></div>
    <div id="slot-4" class="slot"><span class="key">4</span><span class="name">MADERA</span><span class="count" id="count-4">0</span></div>
    <div id="slot-5" class="slot"><span class="key">5</span><span class="name">HOJAS</span><span class="count" id="count-5">0</span></div>
  </div>

  <div id="crafting-menu">
    <h2>MESA DE CRAFTEO</h2>
    <div class="recipe-list" id="recipe-list"></div>
    <p style="font-size: 7px; text-align: center; color: #aaa;">Presiona 'E' para cerrar</p>
  </div>

  <div id="game-over">
    <h1>GAME OVER</h1>
    <button onclick="respawnPlayer()">REAPARECER</button>
  </div>

  <script>
    // 1. Escena y Renderizado
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // 2. Materiales sin Texturas (Colores Planos Solamente)
    const BLOCK_TYPES = {
      1: { name: "Pasto",  mat: new THREE.MeshLambertMaterial({ color: 0x4caf50 }) }, // Verde
      2: { name: "Tierra", mat: new THREE.MeshLambertMaterial({ color: 0x795548 }) }, // Café
      3: { name: "Piedra", mat: new THREE.MeshLambertMaterial({ color: 0x9e9e9e }) }, // Gris
      4: { name: "Madera", mat: new THREE.MeshLambertMaterial({ color: 0x5d4037 }) }, // Madera oscura
      5: { name: "Hojas",  mat: new THREE.MeshLambertMaterial({ color: 0x2e7d32 }) }, // Verde oscuro
      6: { name: "Tablas", mat: new THREE.MeshLambertMaterial({ color: 0xd7ccc8 }) }, // Madera clara
      7: { name: "Mesa C.", mat: new THREE.MeshLambertMaterial({ color: 0xffb74d }) }, // Naranja/Madera
      8: { name: "Palo",   isItem: true },
      9: { name: "Pico",   isItem: true },
      10: { name: "Espada", isItem: true }
    };

    // 3. Inventario y Crafteo
    const inventory = { 1: 10, 2: 10, 3: 5, 4: 5, 5: 5, 6: 0, 7: 0, 8: 0, 9: 0, 10: 0 };
    let selectedSlot = 1;

    const recipes = [
      { name: "Tablas x4", req: { 4: 1 }, give: { 6: 4 } },
      { name: "Palos x4", req: { 6: 2 }, give: { 8: 4 } },
      { name: "Mesa Crafteo", req: { 6: 4 }, give: { 7: 1 } },
      { name: "Pico Piedra", req: { 3: 3, 8: 2 }, give: { 9: 1 } },
      { name: "Espada Piedra", req: { 3: 2, 8: 1 }, give: { 10: 1 } }
    ];

    function updateInventoryUI() {
      for (let i = 1; i <= 5; i++) {
        const item = BLOCK_TYPES[i];
        const slotEl = document.getElementById(`slot-${i}`);
        slotEl.querySelector('.name').innerText = item ? item.name.toUpperCase() : "VACÍO";
        document.getElementById(`count-${i}`).innerText = inventory[i] || 0;
      }
    }

    function renderCraftingMenu() {
      const list = document.getElementById('recipe-list');
      list.innerHTML = "";
      recipes.forEach((r, idx) => {
        let canCraft = true;
        let reqText = "";
        for (let id in r.req) {
          reqText += `${BLOCK_TYPES[id].name}: ${r.req[id]} `;
          if ((inventory[id] || 0) < r.req[id]) canCraft = false;
        }

        const itemEl = document.createElement('div');
        itemEl.className = 'recipe-item';
        itemEl.innerHTML = `
          <div>
            <b>${r.name}</b><br>
            <span style="color:#aaa;">Req: ${reqText}</span>
          </div>
          <button class="recipe-btn" ${canCraft ? '' : 'disabled'} onclick="craftItem(${idx})">CREAR</button>
        `;
        list.appendChild(itemEl);
      });
    }

    window.craftItem = function(index) {
      const r = recipes[index];
      for (let id in r.req) {
        if ((inventory[id] || 0) < r.req[id]) return;
      }
      for (let id in r.req) inventory[id] -= r.req[id];
      for (let id in r.give) inventory[id] = (inventory[id] || 0) + r.give[id];
      updateInventoryUI();
      renderCraftingMenu();
    };

    let isCraftingOpen = false;
    function toggleCraftingMenu() {
      isCraftingOpen = !isCraftingOpen;
      const menu = document.getElementById('crafting-menu');
      if (isCraftingOpen) {
        document.exitPointerLock();
        renderCraftingMenu();
        menu.style.display = 'flex';
      } else {
        menu.style.display = 'none';
        document.body.requestPointerLock();
      }
    }

    // 4. Controles
    let isLocked = false;
    let pitch = 0, yaw = 0;

    document.addEventListener('click', () => {
      if (health > 0 && !isLocked && !isCraftingOpen) document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      isLocked = (document.pointerLockElement === document.body);
    });

    document.addEventListener('mousemove', (e) => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.002;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
      camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
    });

    // 5. Generación del Mundo
    const blockGeo = new THREE.BoxGeometry(1, 1, 1);
    const blocks = [];
    const blockMap = new Map();

    function getBlockKey(x, y, z) { return `${Math.round(x)},${Math.round(y)},${Math.round(z)}`; }
    function getTerrainHeight(x, z) { return Math.floor(Math.sin(x * 0.15) * Math.cos(z * 0.15) * 3 + Math.sin(x * 0.05 + z * 0.05) * 4); }

    function addBlockToWorld(x, y, z, typeId) {
      if (blockMap.has(getBlockKey(x, y, z))) return;

      const mat = BLOCK_TYPES[typeId]?.mat || BLOCK_TYPES[1].mat;
      const cube = new THREE.Mesh(blockGeo, mat);
      cube.position.set(Math.round(x), Math.round(y), Math.round(z));
      cube.userData.typeId = typeId;
      scene.add(cube);
      blocks.push(cube);
      blockMap.set(getBlockKey(x, y, z), cube);
      return cube;
    }

    function removeBlockFromWorld(block) {
      const pos = block.position;
      blockMap.delete(getBlockKey(pos.x, pos.y, pos.z));
      scene.remove(block);
      const index = blocks.indexOf(block);
      if (index > -1) blocks.splice(index, 1);
    }

    function generateTree(x, startY, z) {
      const trunkHeight = 4;
      for (let y = 0; y < trunkHeight; y++) {
        addBlockToWorld(x, startY + y, z, 4);
      }
      const leafBase = startY + trunkHeight - 1;
      for (let lx = -1; lx <= 1; lx++) {
        for (let lz = -1; lz <= 1; lz++) {
          for (let ly = 0; ly <= 2; ly++) {
            if (lx === 0 && lz === 0 && ly < 2) continue;
            addBlockToWorld(x + lx, leafBase + ly, z + lz, 5);
          }
        }
      }
    }

    const WORLD_SIZE = 24;
    for (let x = -WORLD_SIZE / 2; x < WORLD_SIZE / 2; x++) {
      for (let z = -WORLD_SIZE / 2; z < WORLD_SIZE / 2; z++) {
        const height = getTerrainHeight(x, z);
        for (let y = height; y >= height - 4; y--) {
          let typeId = 3;
          if (y === height) typeId = 1;
          else if (y >= height - 2) typeId = 2;
          addBlockToWorld(x, y, z, typeId);
        }

        if (Math.random() < 0.03 && Math.abs(x) > 2 && Math.abs(z) > 2) {
          generateTree(x, height + 1, z);
        }
      }
    }

    // 6. Físicas, Hitbox y Límite de la Colina
    let health = 10;
    const playerHeight = 1.6;
    const playerRadius = 0.25;
    camera.position.set(0, getTerrainHeight(0, 0) + 5, 0);

    // Límite en el eje Z para cortar el paso hacia la colina
    const HILL_LIMIT_Z = 3; 

    const redHeartSVG = `<svg class="pixel-heart" viewBox="0 0 8 8"><path d="M1 1h2v1h-2zM5 1h2v1h-2zM0 2h4v1h-4zM4 2h4v1h-4zM0 3h8v1h-8zM1 4h6v1h-6zM2 5h4v1h-4zM3 6h2v1h-2z" fill="#ff2222"/></svg>`;
    const emptyHeartSVG = `<svg class="pixel-heart" viewBox="0 0 8 8"><path d="M1 1h2v1h-2zM5 1h2v1h-2zM0 2h4v1h-4zM4 2h4v1h-4zM0 3h8v1h-8zM1 4h6v1h-6zM2 5h4v1h-4zM3 6h2v1h-2z" fill="#333333"/></svg>`;

    function updateHealthUI() {
      let heartsHtml = "";
      for (let i = 0; i < health; i++) heartsHtml += redHeartSVG;
      for (let i = health; i < 10; i++) heartsHtml += emptyHeartSVG;
      document.getElementById('health-bar').innerHTML = heartsHtml;
    }

    function takeDamage(amount) {
      if (health <= 0) return;
      health = Math.max(0, health - amount);
      updateHealthUI();
      if (health <= 0) {
        document.exitPointerLock();
        document.getElementById('game-over').style.display = 'flex';
      }
    }

    function respawnPlayer() {
      health = 10;
      updateHealthUI();
      document.getElementById('game-over').style.display = 'none';
      camera.position.set(0, getTerrainHeight(0, 0) + 5, 0);
      velocityY = 0;
      document.body.requestPointerLock();
    }

    const keys = {};
    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyE') toggleCraftingMenu();
      if (e.code.startsWith('Digit')) {
        const num = parseInt(e.code.replace('Digit', ''));
        if (num >= 1 && num <= 5) selectSlot(num);
      }
    });
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    window.addEventListener('wheel', (e) => {
      selectedSlot = (e.deltaY > 0) ? (selectedSlot % 5 + 1) : ((selectedSlot - 2 + 5) % 5 + 1);
      selectSlot(selectedSlot);
    });

    function selectSlot(slotNumber) {
      selectedSlot = slotNumber;
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
      document.getElementById(`slot-${slotNumber}`).classList.add('selected');
    }

    let velocityY = 0;
    const gravity = -0.012;
    const jumpStrength = 0.18;
    let isGrounded = false;

    function getPlayerAABB(pos) {
      return {
        minX: pos.x - playerRadius, maxX: pos.x + playerRadius,
        minY: pos.y - playerHeight, maxY: pos.y + 0.1,
        minZ: pos.z - playerRadius, maxZ: pos.z + playerRadius
      };
    }

    function isColliding(b1, b2) {
      return (b1.minX < b2.maxX && b1.maxX > b2.minX && 
              b1.minY < b2.maxY && b1.maxY > b2.minY && 
              b1.minZ < b2.maxZ && b1.maxZ > b2.minZ);
    }

    function getNearbyBlockBoxes(pos) {
      const blockBoxes = [];
      const minX = Math.floor(pos.x - 1.5), maxX = Math.ceil(pos.x + 1.5);
      const minY = Math.floor(pos.y - playerHeight - 1), maxY = Math.ceil(pos.y + 1);
      const minZ = Math.floor(pos.z - 1.5), maxZ = Math.ceil(pos.z + 1.5);

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          for (let z = minZ; z <= maxZ; z++) {
            if (blockMap.has(getBlockKey(x, y, z))) {
              blockBoxes.push({ 
                minX: x - 0.5, maxX: x + 0.5, 
                minY: y - 0.5, maxY: y + 0.5, 
                minZ: z - 0.5, maxZ: z + 0.5 
              });
            }
          }
        }
      }
      return blockBoxes;
    }

    function updatePhysics() {
      if (!isLocked || health <= 0) return;

      const baseSpeed = 0.08;
      const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? baseSpeed * 1.5 : baseSpeed;

      const moveVector = new THREE.Vector3();
      if (keys['KeyW']) moveVector.z -= 1;
      if (keys['KeyS']) moveVector.z += 1;
      if (keys['KeyA']) moveVector.x -= 1;
      if (keys['KeyD']) moveVector.x += 1;

      if (moveVector.lengthSq() > 0) {
        moveVector.normalize();
        moveVector.applyEuler(new THREE.Euler(0, yaw, 0));
      }

      // Eje X
      camera.position.x += moveVector.x * speed;
      let playerBox = getPlayerAABB(camera.position);
      let nearbyBlocks = getNearbyBlockBoxes(camera.position);

      for (const b of nearbyBlocks) {
        if (isColliding(playerBox, b)) {
          if (moveVector.x > 0) camera.position.x = b.minX - playerRadius;
          else if (moveVector.x < 0) camera.position.x = b.maxX + playerRadius;
          playerBox = getPlayerAABB(camera.position);
        }
      }

      // Eje Z con Límite Invisible en la Colina
      camera.position.z += moveVector.z * speed;
      
      // Restricción: No se puede avanzar más allá del inicio de la colina
      if (camera.position.z > HILL_LIMIT_Z) {
        camera.position.z = HILL_LIMIT_Z;
      }

      playerBox = getPlayerAABB(camera.position);

      for (const b of nearbyBlocks) {
        if (isColliding(playerBox, b)) {
          if (moveVector.z > 0) camera.position.z = b.minZ - playerRadius;
          else if (moveVector.z < 0) camera.position.z = b.maxX + playerRadius;
          playerBox = getPlayerAABB(camera.position);
        }
      }

      // Eje Y (Gravedad)
      velocityY += gravity;
      if (keys['Space'] && isGrounded) {
        velocityY = jumpStrength;
        isGrounded = false;
      }

      camera.position.y += velocityY;
      playerBox = getPlayerAABB(camera.position);
      nearbyBlocks = getNearbyBlockBoxes(camera.position);
      isGrounded = false;

      for (const b of nearbyBlocks) {
        if (isColliding(playerBox, b)) {
          if (velocityY < 0) {
            camera.position.y = b.maxY + playerHeight;
            velocityY = 0;
            isGrounded = true;
          } else if (velocityY > 0) {
            camera.position.y = b.minY - 0.1;
            velocityY = 0;
          }
          break;
        }
      }

      if (camera.position.y < -25) takeDamage(10);
    }

    // 7. Interacciones
    const raycaster = new THREE.Raycaster();
    document.addEventListener('mousedown', (e) => {
      if (!isLocked || health <= 0) return;

      raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
      const intersects = raycaster.intersectObjects(blocks);

      if (intersects.length > 0) {
        const hit = intersects[0];

        if (e.button === 0) {
          const target = hit.object;
          const typeId = target.userData.typeId || 1;
          inventory[typeId] = (inventory[typeId] || 0) + 1;
          updateInventoryUI();
          removeBlockFromWorld(target);
        } 
        else if (e.button === 2) {
          if (BLOCK_TYPES[selectedSlot]?.isItem) return;

          if (inventory[selectedSlot] > 0) {
            const normal = hit.face.normal;
            const newPos = hit.object.position.clone().add(normal);
            const x = Math.round(newPos.x);
            const y = Math.round(newPos.y);
            const z = Math.round(newPos.z);

            const newBlockBox = { minX: x - 0.5, maxX: x + 0.5, minY: y - 0.5, maxY: y + 0.5, minZ: z - 0.5, maxZ: z + 0.5 };
            if (!isColliding(getPlayerAABB(camera.position), newBlockBox)) {
              addBlockToWorld(x, y, z, selectedSlot);
              inventory[selectedSlot]--;
              updateInventoryUI();
            }
          }
        }
      }
    });

    document.addEventListener('contextmenu', e => e.preventDefault());

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Inicialización
    updateHealthUI();
    updateInventoryUI();

    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
